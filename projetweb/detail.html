<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"> 

    </head>
 
    <body onload="loadXMLDocAnddisplayDetails()">
    <h1 class="text-center">Information sur chaque Question</h1>
    <div class="container mt-5">
        <div class="row justify-content-start ">

            <div class="col-3">
            <img src="img/16.jpg" class="w-100 h-100 rounded" alt="img" >
            </div>
            <div class="col-6">
                
                <div class="card shadow-sm ">

                    <img src="" id="img-detail" class="card-img-top" alt="Image de la question" style="max-height: 250px; object-fit: contain; padding: 15px; background-color: #f8f9fa;">
                    <div class="card-body p-3 mb-2 bg-body-secondary">
                    <h6 class="card-subtitle mb-5 text-muted" id="categorie-detail"></h6>
                    <h4 class="card-title" id="contenu-detail"></h4>
                    </div>
                    <ul class="list-group list-group-flush text-center">
                    <li class="list-group-item" id="rep1-detail"></li>
                    <li class="list-group-item" id="rep2-detail"></li>
                    <li class="list-group-item" id="rep3-detail"></li>
                    <li class="list-group-item" id="rep4-detail"></li>
                    </ul>
                    
                    <div class="card-footer text-muted d-flex justify-content-between p-3 mb-2 bg-info text-dark">
                    <span id="bonne-rep-detail"></span>
                    <span id="points-detail"></span>
                    </div>

                </div>
            </div>
            <div class="col-3">
            <img src="img/poke20.jpg" class="w-100 h-100 rounded" alt="img" >
            </div>
        </div>
    </div>

    

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script> 
    <script src="js/detail.js"></script>
</body>
</html>
