<!DOCTYPE html>
<html>
<head>
    <title>Interface Jeu</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"> 

</head>
<body onload=loadXMLDoc()>

    <table id="data" class="table"> 
        
    </table>

<div class="container mt-5">
      
    <div class="row justify-content-start">
        <div class="col-3">
        <img src="img/poke13.jpg" class="w-100 h-100 rounded" alt="img" style=" object-fit: cover;">
        </div>
        <div class="col-6">

            <div class="card shadow-sm" id="quiz-card">
            <div style="display: flex;justify-content: center;">
              <img src="" id="question-image" class="card-img-top" alt="Image de la question" style="max-height: 300px;max-width: 300px;  padding: 10px;">  
            </div>
              <div class="card-body">
                <h5 class="card-title text-center" id="question-text"></h5>
              </div>

              <div class="list-group list-group-flush" id="answer-buttons">
              </div>

              <div class="card-footer p-3">
                <div class="row justify-content-between">
                <div class="col-6">
                  <button type="button" class="btn btn-success w-100" id="validate-btn" onclick="handleValidateOrNext()">Valider</button>
                </div>
                <div class="col-6">
                  <button type="button" class="btn btn-outline-warning w-100" id="finish-btn" onclick="Terminer()">Terminer le Quiz</button>
                </div>
              </div>
              </div>
              
            </div>

            <div id="quiz-end-message" class="text-center" style="display: none;">
                <h1>Quiz Terminé !</h1>
                <p id="score"></p>
                <p>Merci d'avoir joué.</p>
                <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
            </div>

        </div>
        <div class="col-3">
        <img src="img/Dracaufeu.jpeg" class="w-100 h-100 rounded" alt="img" style=" object-fit: cover;">
        </div>
    </div>
</div>
    


    
 <script src="js/jeu_script.js"></script>   
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script> 
</body>


</html>
